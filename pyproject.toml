[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autogen-capsolver"
version = "0.1.0"
description = "CapSolver FunctionTools for Microsoft AutoGen."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "capsolver-ai", email = "dev@capsolver.ai" }]
keywords = ["capsolver", "captcha", "ai-agents", "autogen"]
dependencies = ["capsolver-agent>=0.1.0", "autogen-core>=0.5"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4", "mypy>=1.10"]

[project.urls]
Documentation = "https://docs.capsolver.com/en/guide/ai/capsolver-for-ai-agents/"

[tool.hatch.build.targets.wheel]
packages = ["src/autogen_capsolver"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120
